# Duck Game Friends room relay. UDP needs a dedicated IPv4 address:
#   fly ips allocate-v4 --app duckfriends-relay
app = "duckfriends-relay"
primary_region = "iad"

[[services]]
  internal_port = 7777
  protocol = "udp"
  # Rooms live in memory, so the relay must never be stopped for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7777

[[restart]]
  policy = "always"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
